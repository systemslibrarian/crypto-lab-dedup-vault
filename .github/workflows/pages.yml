name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, claims, accessibility, mutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Type-check application and browser tests
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and coverage gate
        run: npm run test:coverage

      - name: Build production lesson
        run: npm run build

      - name: Audit high-severity dependency findings
        run: npm audit --audit-level=high

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Chromium and system dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium

      - name: Learner-visible claim gate
        run: npm run test:claims

      - name: Accessibility and reflow gate
        run: npm run test:a11y

      - name: Clean-baseline source-mutation gate
        run: npm run test:mutations

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claim-mutations
          path: test-results/claim-mutations/
          if-no-files-found: ignore
          retention-days: 14

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
