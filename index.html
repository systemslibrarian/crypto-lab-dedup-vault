<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Dark is the only theme. Pin it before first paint, including for visitors
      // whose browser still carries a historical light-theme preference.
      (function () {
        try {
          localStorage.setItem("theme", "dark");
        } catch (error) {
          // Storage can be disabled; the literal document attribute still wins.
        }
        document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Executable encrypted-deduplication lab comparing fresh encryption, local message-locked encryption, and server-aided VOPRF derivation."
    />
    <meta name="theme-color" content="#071311" />
    <meta name="color-scheme" content="dark" />
    <title>Dedup Vault — crypto-lab</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <style>
      .cl-topbar {
        --cl-ink: color-mix(in srgb, var(--accent, #35d6bb) 60%, #eafff8);
        display: flex;
        position: sticky;
        top: 0;
        z-index: 1000;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.7rem clamp(0.9rem, 3vw, 2rem);
        border-bottom: 1px solid
          color-mix(in srgb, var(--accent, #35d6bb) 22%, transparent);
        background: #0b1512;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }
      .cl-brand {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        text-decoration: none;
      }
      .cl-badge {
        display: grid;
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        place-items: center;
        border: 1.5px solid var(--accent, #35d6bb);
        border-radius: 10px;
        color: var(--cl-ink);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      .cl-brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.15;
      }
      .cl-title {
        color: #eafff8;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      .cl-sub {
        color: #8fb3aa;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
      }
      .cl-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .cl-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.5rem 0.85rem;
        border: 1px solid var(--cl-ink);
        border-radius: 10px;
        background: transparent;
        color: var(--cl-ink);
        font: inherit;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-decoration: none;
        text-transform: uppercase;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
      }
      .cl-btn:hover {
        border-color: var(--accent, #35d6bb);
        background: color-mix(in srgb, var(--accent, #35d6bb) 14%, #0b1512);
        color: #eafff8;
      }
      .cl-btn:focus-visible {
        outline: 2px solid #eafff8;
        outline-offset: 2px;
      }
      .cl-btn svg {
        width: 15px;
        height: 15px;
      }
      .cl-skip-link {
        position: absolute;
        top: -3rem;
        left: 0.5rem;
        z-index: 1001;
        padding: 0.55rem 1rem;
        border-radius: 0 0 10px 10px;
        background: #eafff8;
        color: #0b1512;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-decoration: none;
        transition: top 0.15s ease;
      }
      .cl-skip-link:focus {
        top: 0;
        outline: 2px solid var(--accent, #35d6bb);
        outline-offset: 2px;
      }
      @media (max-width: 560px) {
        .cl-sub {
          display: none;
        }
        .cl-btn span {
          display: none;
        }
      }
      @media (pointer: coarse) {
        .cl-btn {
          min-height: 44px;
        }
      }
      @media (pointer: coarse) and (min-width: 380px) {
        .cl-btn {
          min-width: 44px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cl-skip-link,
        .cl-btn {
          transition: none;
        }
      }
    </style>
    <a class="cl-skip-link" href="#app">Skip to content</a>
    <header class="cl-topbar" role="banner" aria-label="Crypto Lab">
      <a
        class="cl-brand"
        href="https://crypto-lab.systemslibrarian.dev/"
        aria-label="Crypto Lab home"
      >
        <span class="cl-badge">CL</span>
        <span class="cl-brand-text">
          <span class="cl-title">CRYPTO LAB</span>
          <span class="cl-sub">systemslibrarian.dev</span>
        </span>
      </a>
      <nav class="cl-actions" aria-label="Crypto Lab navigation">
        <a
          class="cl-btn"
          href="https://crypto-lab.systemslibrarian.dev/"
          aria-label="Crypto Lab menu"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
          <span>Menu</span>
        </a>
        <a
          class="cl-btn"
          href="https://github.com/systemslibrarian/crypto-lab-dedup-vault"
          target="_blank"
          rel="noopener"
          aria-label="View this project on GitHub"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7 0-.7 0-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0C17.3 5 18.3 5.3 18.3 5.3c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"
            />
          </svg>
          <span>GitHub</span>
        </a>
      </nav>
    </header>
    <script>
      (function () {
        function dedupeBanner() {
          var bar = document.querySelector(".cl-topbar");
          if (!bar) return;
          document.querySelectorAll('[role="banner"]').forEach(function (el) {
            if (el !== bar) el.setAttribute("role", "group");
          });
          Array.prototype.forEach.call(
            document.querySelectorAll("header"),
            function (el) {
              if (el === bar || el.hasAttribute("role")) return;
              if (el.closest("main, article, aside, nav, section")) return;
              el.setAttribute("role", "group");
            },
          );
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", dedupeBanner);
        } else {
          dedupeBanner();
        }
      })();
    </script>
    <noscript>
      <p class="noscript" role="alert">
        This lesson computes its evidence in your browser. Enable JavaScript to
        run it.
      </p>
    </noscript>
    <div id="app" tabindex="-1"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
